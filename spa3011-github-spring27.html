<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPA 3011 — Course Modules — Spring 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', Arial, sans-serif;
    background: transparent;
    color: #1a1a1a;
    padding: 1rem;
  }

  img.banner {
    display: block;
    max-width: 100%;
    width: auto;
    max-height: 250px;
    height: auto;
    margin-bottom: 1.25rem;
    border-radius: 4px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  thead tr { background: #1a3a5c; }

  thead th {
    padding: 8px 12px;
    text-align: left;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
  }

  tbody tr { border-bottom: 1px solid #f0eeea; transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover:not(.active) { background: #fafaf8; }

  td { padding: 10px 12px; font-size: 0.9rem; vertical-align: middle; }

  td.wk {
    font-size: 0.75rem;
    font-weight: 600;
    color: #bbb;
    letter-spacing: 0.04em;
    white-space: nowrap;
    width: 64px;
  }

  td.ttl a {
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 400;
    transition: color 0.15s;
  }

  td.ttl a:hover { color: #1a3a5c; text-decoration: underline; }

  .second-link {
    font-size: 0.9rem;
    color: #1a1a1a;
    margin-left: 8px;
  }

  .second-link a {
    color: #1a1a1a;
    text-decoration: none;
  }

  .second-link a:hover { text-decoration: underline; }

  td.dt {
    font-size: 0.75rem;
    color: #bbb;
  }

  /* ── Active row ── */
  tr.active {
    background: #e8f0f8 !important;
    outline: 2px solid #1a3a5c;
    outline-offset: -2px;
  }

  tr.active td.wk { color: #1a3a5c; }

  tr.active td.ttl a {
    color: #1a3a5c;
    font-weight: 700;
  }

  tr.active td.dt { color: #1a3a5c; }

  .badge {
    display: inline-block;
    background: #1a3a5c;
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }

  @media (max-width: 500px) {
    td { padding: 8px 8px; font-size: 0.82rem; }
    td.dt { display: none; }
    thead th:last-child { display: none; }
  }
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
  }

  .btn-widgets,
  .btn-announce {
    display: inline-block;
    background: #1a3a5c;
    color: #fff;
    font-family: 'DM Sans', Arial, sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 20px;
    text-decoration: none;
    transition: background 0.15s;
  }

  .btn-widgets:hover, .btn-announce:hover { background: #24527f; }

  .btn-announce {
    background: #fff;
    color: #1a3a5c;
    border: 1.5px solid #1a3a5c;
  }

  .btn-announce:hover { background: #e8f0f8; color: #1a3a5c; }

</style>
</head>
<body>

<div class="top-bar">
  <a class="btn-announce" href="https://webcourses.ucf.edu/courses/1533251/modules#module_3126775" target="_top">Course Information and Bulletins</a>
  <a class="btn-widgets" href="https://adres-ctrl.github.io/coursemapping/speech_science_guide.html" target="_top">Widgets</a>
</div>

<img class="banner"
  src="https://webcourses.ucf.edu/courses/1533251/files/127401831/preview"
  alt="SPA 3011 Course Banner" />

<table>
  <thead>
    <tr>
      <th>Week</th>
      <th>Module Title</th>
      <th>Dates</th>
    </tr>
  </thead>
  <tbody id="moduleBody"></tbody>
</table>

<script>
  // ─────────────────────────────────────────────────────
  //  UPDATE DATES EACH SEMESTER — everything else is auto
  //  Format: "YYYY-MM-DD"
  // ─────────────────────────────────────────────────────
  const modules = [
    {
      wk: "Wk 1",
      title: "Introduction to Speech Science",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126776",
      start: "2027-01-11", end: "2027-01-17"
    },
    {
      wk: "Wk 2",
      title: "The Nature of Sound and Waves",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126777",
      start: "2027-01-18", end: "2027-01-24"
    },
    {
      wk: "Wk 3",
      title: "Aerodynamic Energy",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126778",
      start: "2027-01-25", end: "2027-01-31"
    },
    {
      wk: "Wk 4",
      title: "Fundamental Sources",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126779",
      start: "2027-02-01", end: "2027-02-07"
    },
    {
      wk: "Wk 5",
      title: "Exam 1",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126780",
      start: "2027-02-08", end: "2027-02-14"
    },
    {
      wk: "Wk 6",
      title: "Source Filter Theory",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126781",
      start: "2027-02-15", end: "2027-02-21"
    },
    {
      wk: "Wk 7",
      title: "Multiple Source Sounds",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126782",
      start: "2027-02-22", end: "2027-02-28"
    },
    {
      wk: "Wk 8",
      title: "Suprasegmentals",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126783",
      start: "2027-03-01", end: "2027-03-07"
    },
    {
      wk: "Wk 9",
      title: "Exam 2",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126784",
      start: "2027-03-08", end: "2027-03-14"
    },
    {
      wk: "Wk 10",
      title: "Spring Break (No Classes)",
      url: null,
      start: "2027-03-15", end: "2027-03-21"
    },
    {
      wk: "Wk 11",
      title: "Transfers of Energy",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126785",
      start: "2027-03-22", end: "2027-03-28"
    },
    {
      wk: "Wk 12",
      title: "Electrical Energy and Communication",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126786",
      start: "2027-03-29", end: "2027-04-04"
    },
    {
      wk: "Wk 13",
      title: "Acoustic Analysis and Perception",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126787",
      start: "2027-04-05", end: "2027-04-11"
    },
    {
      wk: "Wk 14",
      title: "Quantification of Speech Science",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126788",
      secondTitle: "Clinical Applications",
      secondUrl: "https://webcourses.ucf.edu/courses/1533251/modules/3126789",
      start: "2027-04-12", end: "2027-04-18"
    },
    {
      wk: "Wk 15",
      title: "Final Exam Review",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126790",
      start: "2027-04-19", end: "2027-04-25"
    },
    {
      wk: "Wk 16",
      title: "Final Exam",
      url: "https://webcourses.ucf.edu/courses/1533251/modules/3126790",
      start: "2027-04-28", end: "2027-05-04"
    }
  ];
  // ─────────────────────────────────────────────────────

  function fmt(str) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function build() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const tbody = document.getElementById("moduleBody");
    tbody.innerHTML = "";

    modules.forEach(mod => {
      const [sy, sm, sd] = mod.start.split("-").map(Number);
      const [ey, em, ed] = mod.end.split("-").map(Number);
      const s = new Date(sy, sm - 1, sd);
      const e = new Date(ey, em - 1, ed);
      e.setHours(23, 59, 59);

      const current = today >= s && today <= e;
      const tr = document.createElement("tr");
      if (current) tr.classList.add("active");

      const badge = current ? `<span class="badge">&#9654; This Week</span>` : "";

      const second = mod.secondTitle
        ? `<span class="second-link">&nbsp;|&nbsp;<a href="${mod.secondUrl}" target="_top">${mod.secondTitle}</a></span>`
        : "";

      const titleCell = mod.url
        ? `<a href="${mod.url}" target="_top">${mod.title}</a>`
        : `<span style="color:#bbb;font-style:italic;">${mod.title}</span>`;

      tr.innerHTML = `
        <td class="wk">${mod.wk}</td>
        <td class="ttl">${titleCell}${second}${badge}</td>
        <td class="dt">${fmt(mod.start)} – ${fmt(mod.end)}</td>
      `;

      tbody.appendChild(tr);
    });
  }

  build();
</script>
</body>
</html>
